      - "${GLM_INT4_UTIL:-0.97}"
      - --max-num-seqs
      - "8"
      - --enable-expert-parallel
      - --enable-prefix-caching
      - --enable-prompt-tokens-details
      - --disable-custom-all-reduce
      - --compilation-config
      - '{"cudagraph_capture_sizes":[1,2,4,8],"max_cudagraph_capture_size":8}'
