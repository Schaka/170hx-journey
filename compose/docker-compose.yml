      - --served-model-name
      - glm-5.3-flash
      - --pipeline-parallel-size
      - "4"
      - --language-model-only
      - --max-model-len
      - "${GLM_MAXLEN:-262144}"
      - --gpu-memory-utilization
      - "0.92"
      - --max-num-seqs
      - "8"
      - --max-num-batched-tokens
      - "4096"
      - --kv-cache-dtype
      - auto
      - --enable-prefix-caching
      - --enable-prompt-tokens-details
      - --compilation-config
      - '{"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[1,2,4,8],"max_cudagraph_capture_size":8}'
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":2}'
      - --enable-auto-tool-choice
      - --tool-call-parser
      - glm47
      - --reasoning-parser
      - glm45

  glm53flash6gpu:
