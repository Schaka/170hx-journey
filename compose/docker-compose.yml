      - --gpu-memory-utilization
      - "0.85"
      - --max-num-seqs
      - "16"
      - --max-num-batched-tokens
      - "8192"
      - --enable-prefix-caching
      - --enable-prompt-tokens-details
      - --disable-custom-all-reduce
      - --compilation-config
      - '{"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[1,2,4,8,16],"max_cudagraph_capture_size":16}'
      - --speculative-config
