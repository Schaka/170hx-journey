      - ${HOME}/cache/glm53mix/triton:/root/.triton
      - ${HOME}/cache/glm53mix/nv:/root/.nv
      - ${HOME}/cache/glm53mix/humming:/root/.humming
      - ${HOME}/cache/glm53mix/cupy:/root/.cupy
      - ${HOME}/cache/glm53mix/tilelang:/root/.tilelang
    command:
      - /model
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --served-model-name
      - glm-5.3
      - --pipeline-parallel-size
      - "8"
      - --tensor-parallel-size
      - "1"
      - --attention-backend
      - TRITON_MLA_SPARSE
      - --kv-cache-dtype
      - fp8_ds_mla
      - --block-size
      - "64"
      - --dtype
      - bfloat16
      - --max-model-len
      - "${GLM_MIX_MAXLEN:-1048576}"
      - --gpu-memory-utilization
      - "${GLM_MIX_UTIL:-0.95}"
      - --max-num-seqs
      - "8"
      - --enable-prefix-caching
      - --enable-prompt-tokens-details
      - --compilation-config
      - '{"cudagraph_capture_sizes":[1,2,4,8,16,24,32,48],"max_cudagraph_capture_size":48}'
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":${GLM_MIX_SPEC_K:-3}}'
      - --enable-auto-tool-choice
      - --tool-call-parser
