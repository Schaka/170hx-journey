    environment:
      NCCL_ALGO: "Ring"
      NCCL_PROTO: "Simple"
      VLLM_PP_LAYER_PARTITION: "${GLM_INT4_PARTITION:-20,20,20,18}"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      GLM53_IDX_PREFILL_BUF_TOKENS: "${GLM_INT4_IDX_BUF:-4000000}"
    volumes:
      - ${GLM_INT4_MODEL:-/backup-models/GLM-5.3-AWQ-INT4}:/model
      - ${HOME}/patches/vllm-backport/deepseek_v32-fused-q-sm80-fp8.py:/usr/local/lib/python3.12/dist-packages/vllm/models/deepseek_v32/common/kernels.py:ro
      - ${HOME}/patches/vllm-backport/mla-attention-sparse-mha-no-prefill.py:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/layers/attention/mla_attention.py:ro
