    shm_size: "16g"
    ports:
      - "8098:8000"
    environment:
      NCCL_ALGO: "Ring"
      NCCL_PROTO: "Simple"
    volumes:
      - ${GLM_INT4_MODEL:-/backup-models/GLM-5.3-AWQ-INT4}:/model
      - ${HOME}/cache/glm53int4/vllm:/root/.cache/vllm
      - ${HOME}/cache/glm53int4/flashinfer:/root/.cache/flashinfer
      - ${HOME}/cache/glm53int4/triton:/root/.triton
      - ${HOME}/cache/glm53int4/nv:/root/.nv
      - ${HOME}/cache/glm53int4/humming:/root/.humming
      - ${HOME}/cache/glm53int4/cupy:/root/.cupy
      - ${HOME}/cache/glm53int4/tilelang:/root/.tilelang
    command:
      - /model
      - --host
